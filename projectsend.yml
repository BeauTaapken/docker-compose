services:
  projectsend:
    image: lscr.io/linuxserver/projectsend:latest
    container_name: projectsend
    environment:
      - PUID=${PGID}
      - PGID=${PUID}
      - TZ=${TZ}
    volumes:
      - ./config/projectsend:/config
      - ./data/projectsend:/data
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.projectsend.rule=Host(`projectsend.${HOST}`)"
      - "traefik.http.routers.projectsend.service=projectsend"
      - "traefik.http.routers.projectsend.entrypoints=https"
      - "traefik.http.routers.projectsend.tls=true"
      - "traefik.http.routers.projectsend.tls.certresolver=letsencrypt"
      - "traefik.http.services.projectsend.loadbalancer.server.port=80"
