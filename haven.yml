services:
  haven:
    image: ghcr.io/ancsemi/haven:latest
    container_name: haven
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SERVER_NAME=Age verification coming soon
      - PORT=3000
      - ADMIN_USERNAME=${HAVEN_ADMIN_USERNAME}
    volumes:
      - ./data/haven:/data
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.haven.rule=Host(`haven.${HOST}`)"
      - "traefik.http.routers.haven.service=haven"
      - "traefik.http.routers.haven.entrypoints=https"
      - "traefik.http.routers.haven.tls=true"
      - "traefik.http.routers.haven.tls.certresolver=letsencrypt"
      - "traefik.http.services.haven.loadbalancer.server.port=3000"
      - "traefik.http.services.haven.loadbalancer.serverstransport=havenInsecure@file"
      - "traefik.http.services.haven.loadbalancer.server.scheme=https"
