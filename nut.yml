services:
  nut-upsd:
    image: ghcr.io/cplieger/docker-nut-upsd:latest
    container_name: nut-upsd
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - UPS_NAME=nutdev-usb1
      - UPS_DESC=APC BX950MI
      - UPS_DRIVER=usbhid-ups
      - UPS_PORT=auto
      - API_USER=${NUT_USER}
      - API_PASSWORD=${NUT_PASSWORD}
      - SHUTDOWN_ON_BATTERY_CRITICAL=true
    ports:
      - "3493:3493"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    device_cgroup_rules:
      - "c 189:* rmw"
