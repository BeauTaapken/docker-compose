services:
  nut-upsd:
    image: ghcr.io/cplieger/docker-nut-upsd:latest
    container_name: nut-upsd
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - UPS_NAME=nutdev-usb1
      - UPS_DESC=APC BX950MI
      - UPS_DRIVER=usbhid-ups
      - UPS_PORT=auto
      - API_USER=${NUT_USER}
      - API_PASSWORD=${NUT_PASSWORD}
      - SHUTDOWN_ON_BATTERY_CRITICAL=true
    ports:
      - "3493:3493"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    device_cgroup_rules:
      - "c 189:* rmw"

  nutshell:
    image: exelban/nutshell:latest
    container_name: nutshell
    restart: unless-stopped
    environment:
      - UPSD_HOST=nut-upsd
      - UPSD_PORT=3493
      - UPSD_USERNAME=${NUT_USER}
      - UPSD_PASSWORD=${NUT_PASSWORD}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nutshell.rule=Host(`nutshell.${HOST}`)"
      - "traefik.http.routers.nutshell.service=nutshell"
      - "traefik.http.routers.nutshell.entrypoints=https"
      - "traefik.http.routers.nutshell.tls=true"
      - "traefik.http.routers.nutshell.tls.certresolver=letsencrypt"
      - "traefik.http.services.nutshell.loadbalancer.server.port=8833"
    depends_on:
      - nut-upsd
